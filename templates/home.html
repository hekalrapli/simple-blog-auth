{{define "content"}}
<h1>All Articles</h1>

{{if .Articles}}
<div class="article-list">
    {{range .Articles}}
    <article class="article-card">
        <h2><a href="/articles/{{.Id}}">{{.Title}}</a></h2>
        <div class="article-meta">
            by {{.AuthorName}} &middot; {{.CreatedAt}}
        </div>
        <p class="article-excerpt">{{.Content}}</p>
        <a href="/articles/{{.Id}}" class="read-more">Read more &rarr;</a>
    </article>
    {{end}}
</div>
{{else}}
<div class="empty-state">
    <p>No articles yet.</p>
    <p><a href="/register">Create an account</a> to start writing.</p>
</div>
{{end}}
{{end}}
